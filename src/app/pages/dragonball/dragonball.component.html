<h1>Dragonball Page</h1>
<hr />

<section class="row">

    <div class="col-12 col-sm-6">
        <h2>Agregar</h2>

        <h3>Personaje: {{ name() }}</h3>

        <input 
            type="text" 
            class="form-control" 
            placeholder="ejemplo: goku" 
            [value]="name()"
            (input)="name.set(txtName.value)" 
            #txtName
        />

        <h3>Poder: {{ power() }}</h3>
        
        <input 
            type="number" 
            class="form-controlmt-2" 
            placeholder="ejemplo: 250"
            [value]="power()"
            (input)="power.set(txtPower.valueAsNumber)" 
            #txtPower
        />

        <button 
            (click)="addCharacter()" 
            class="mt-2 btn btn-primary"
        > 
        Agregar
        </button>
    </div>

    <div class="col-12 col-sm-6">
        <h3>Listado</h3>
        <ul>
            @for (character of characters(); track character.id; let idx = $index) {
                @if(character.power > 500){
                    <li>
                        <span>{{idx + 1}} - {{ character.name }}</span>
                        <strong [class.text-danger]="character.power > 3000"> ({{character.power}})</strong>
                    </li>
                } @else {
                    <li>
                        <strong> Nada mas</strong>
                    </li>
                }
            }
        </ul>
    </div>

</section>
