<h1> Counter Page </h1>
<br>
<h2> Counter: {{ counter }} </h2>
<h2> Counter Signal: {{ counterSignal() }} </h2>
<br>
<button (click)="increment()" class="btn btn-primary"> Click Me!</button>
<br>
<button (click)="decrement()" class="btn btn-danger"> Don't click me bro!</button>
<br>
<button (click)="resetCounter()" class="btn btn-primary"> Reset counter!</button>
